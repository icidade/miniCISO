generated_from: chief-of-staff/config.yaml
sanitized: true
profile: chief-of-staff
model:
  provider: openai-codex
  default: gpt-5.4
  temperature: 0.2
toolsets:
- hermes-cli
agent:
  # Legacy ceiling remains as a secondary failsafe. The governance controller
  # below must stop or pause execution earlier for bounded and engagement work.
  max_turns: 24
  tool_use_enforcement: auto
  task_completion_guidance: true
  environment_probe: true
  gateway_timeout: 1800
  gateway_timeout_warning: 900
  clarify_timeout: 600
  reasoning_effort: medium
terminal:
  backend: local
  cwd: .
  timeout: 180
  persistent_shell: true
  auto_source_bashrc: true
web:
  backend: ''
  search_backend: ''
  extract_backend: ''
browser:
  engine: auto
  allow_private_urls: false
  auto_local_for_private_urls: true
  inactivity_timeout: 120
  command_timeout: 30
  dialog_policy: must_respond
  dialog_timeout_s: 300
compression:
  enabled: true
  # Existing compression still helps, but governance should compact or
  # externalize before the old late-compression failure mode recurs.
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
cost_context_governance:
  # v0.7.0 installed default. Use observe for diagnostics/migration, disabled
  # only by explicit operator choice.
  mode: enforce
  workspace_dir: engagements
  default_profile: conversational
  force_for_profiles:
    - chief-of-staff
  engagement_keywords:
    - miniciso
    - security
    - assessment
    - review
    - threat model
    - appsec
    - bug bounty
  threshold:
    informational_ratio: 0.5
    warning_ratio: 0.7
    approval_ratio: 0.85
    hard_stop_ratio: 1.0
  progress:
    equivalent_tool_calls: 3
    same_error_repeats: 3
    no_progress_iterations: 3
    timeout_checkpoint_seconds: 45
  role_toolsets:
    chief:
      - delegation
      - todo
      - session_search
      - file
      - search
      - skills
      - browser
      - web
    sme:
      - file
      - search
      - terminal
      - web
      - browser
    qa:
      - file
      - search
      - terminal
      - web
      - browser
      - session_search
  profiles:
    # Conversational: minimal overhead, no delegation, small schema/call budget.
    conversational:
      total_model_calls: 3
      calls_per_agent: 3
      calls_per_delegated_task: 0
      input_tokens: 10000
      output_tokens: 3000
      total_tokens: 13000
      context_tokens_per_request: 10000
      wall_clock_seconds: 90
      tool_invocations: 6
      retries: 1
      delegation_count: 0
      iterations_without_progress: 2
      qa_reserve_ratio: 0.0
    # Bounded: short implementation/review/investigation with one narrow child.
    bounded:
      total_model_calls: 6
      calls_per_agent: 5
      calls_per_delegated_task: 3
      input_tokens: 18000
      output_tokens: 8000
      total_tokens: 26000
      context_tokens_per_request: 9000
      wall_clock_seconds: 180
      tool_invocations: 15
      retries: 3
      delegation_count: 1
      iterations_without_progress: 3
      qa_reserve_ratio: 0.1
    # Standard engagement: typical MiniCISO assessment with SMEs plus protected QA.
    standard_engagement:
      total_model_calls: 8
      calls_per_agent: 6
      calls_per_delegated_task: 5
